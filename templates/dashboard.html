
{% extends "base.html" %}

{% block content %}
<div class="dashboard-container">
    <h1>Admin Dashboard</h1>
    <div class="dashboard-sections">
        <section class="products-section">
            <h2>Manage Products</h2>
            <form method="POST" action="{{ url_for('add_product') }}" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="Product Name" required>
                <textarea name="description" placeholder="Description" required></textarea>
                <input type="number" name="price" placeholder="Price" step="0.01" required>
                <input type="file" name="image" accept="image/*" required>
                <button type="submit">Add Product</button>
            </form>
        </section>
        
        <section class="tutorials-section">
            <h2>Manage Tutorials</h2>
            <form method="POST" action="{{ url_for('add_tutorial') }}">
                <input type="text" name="title" placeholder="Tutorial Title" required>
                <textarea name="content" placeholder="Content" required></textarea>
                <input type="text" name="youtube_links" placeholder="YouTube Links">
                <input type="text" name="downloads" placeholder="Download Links">
                <button type="submit">Add Tutorial</button>
            </form>
        </section>
    </div>
</div>
{% endblock %}
